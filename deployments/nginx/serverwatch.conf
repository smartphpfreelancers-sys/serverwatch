# ServerWatch Community Edition — Nginx reverse proxy.
#
# Serves the built dashboard from web/dist and proxies /api, /health, /ready,
# /status, and (optionally) /metrics to the backend on 127.0.0.1:8080.
#
# Install:
#   sudo cp deployments/nginx/serverwatch.conf /etc/nginx/sites-available/serverwatch
#   sudo ln -s /etc/nginx/sites-available/serverwatch /etc/nginx/sites-enabled/serverwatch
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or let `scripts/harden-server.sh` install it for you together with account
# authentication and the read-only public status page. See docs/SECURITY.md.

# Basic abuse protection at the edge, complementing the backend token-bucket
# limiter. Tune the rate for your deployment.
limit_req_zone $binary_remote_addr zone=serverwatch_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /opt/serverwatch/web/dist;
    index index.html;

    # Do not advertise the exact Nginx version.
    server_tokens off;

    # Same security headers the backend sets, applied to static assets that
    # never reach the backend. Keep these in sync with
    # server/internal/http/security.go. `always` includes error responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    # Optional: uncomment to send HSTS once the dashboard is served over HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=serverwatch_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8080/ready;
        access_log off;
    }

    # Optional public status page. Uncomment (and set
    # SERVERWATCH_STATUS_PAGE_ENABLED=true in the environment file) to serve the
    # read-only status page to anyone who can reach this host. It exposes monitor
    # names, state, response time, and last check time - never targets or config.
    # location = /status {
    #     proxy_pass http://127.0.0.1:8080/status;
    # }
    # location = /status.css {
    #     proxy_pass http://127.0.0.1:8080/status.css;
    # }

    # Prometheus scraping. Only expose this to your monitoring network. It is
    # intentionally not served publicly by default; restrict with `allow`/`deny`
    # or a private listener before enabling in Nginx.
    # location = /metrics {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080/metrics;
    # }
}

# --- HTTPS / TLS ---
#
# Obtain a certificate (replace the hostname), then add a TLS server block.
# With Certbot this file is rewritten automatically:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d serverwatch.example.com
#
# Certbot generates a block equivalent to the following. Note that when a TLS
# server block is active, browsers will not send the session cookie over HTTP
# if you set SERVERWATCH_COOKIE_SECURE=true in the environment file — set that
# to true only once HTTPS works. It is safe to redirect HTTP to HTTPS afterwards:
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name serverwatch.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/serverwatch.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/serverwatch.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#
#     # ...repeat the root/location/server_tokens/add_header blocks above...
# }
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name serverwatch.example.com;
#     return 301 https://$host$request_uri;
# }
